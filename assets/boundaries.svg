<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img"><style>text{font-family:Arial,sans-serif;fill:#132c43}.mono{font-family:monospace}.small{font-size:19px}.muted{fill:#5c6b72}</style><rect width="1200" height="440" rx="24" fill="#f5f1e8"/><text x="48" y="60" font-size="30">A result and a refused request are different outcomes.</text><rect x="40" y="95" width="535" height="245" rx="16" fill="#d8e9e1"/><text x="65" y="140" font-size="25">Established result</text><text x="65" y="186" class="mono" font-size="25">d(7)/dx = 0</text><text x="65" y="228" class="small">solved: TRUE_ONLY · zero: TRUE_ONLY</text><text x="65" y="270" class="small">Empty coefficients are backed by an explicit zero proof.</text><rect x="605" y="95" width="555" height="245" rx="16" fill="#ede1c7"/><text x="630" y="140" font-size="25">Ambiguous integral bounds</text><text x="630" y="186" class="mono" font-size="25">∫ x² dx: primitive is available</text><text x="630" y="228" class="small">integral: [] · AMBIGUOUS_BOUNDS</text><text x="630" y="270" class="small">No endpoint choice or numerical answer is invented.</text><text x="48" y="397" class="small muted">Derived from recorded native cases; absence, explicit negation and contradiction stay distinct.</text></svg>